<!DOCTYPE html> <html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <style> :root{--c:#538d4e;--p:#b59f3b;--f:#2b7bb9;--a:#3a3a3c} *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;font-family:sans-serif} html,body{height:100%;overflow:hidden} body{background:#121213;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 3px} header{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:380px;font-size:11px;font-weight:bold;padding-bottom:3px;border-bottom:1px solid #333;flex-shrink:0} .modes{display:flex;gap:3px} .mbtn{background:#2a2b2e;color:#aaa;border:1px solid #444;border-radius:4px;padding:2px 5px;font-size:10px;cursor:pointer} .mbtn.active{background:#2b7bb9;color:#fff;border-color:#2b7bb9} .legend{display:flex;gap:4px;font-size:9px;color:#aaa} .dot{width:6px;height:6px;display:inline-block;border-radius:2px;margin-right:2px} #game-area{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%;padding:2px 0} #board{display:grid;grid-template-rows:repeat(6,1fr);grid-gap:3px;height:100%;max-height:220px;aspect-ratio:4/6} .row{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:3px} .tile{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:bold;border:1.5px solid var(--a);border-radius:3px} .tile.pending{border-color:#e0a96d;animation:blink 1s infinite alternate} @keyframes blink{0%{border-color:#e0a96d}100%{border-color:#888}} .correct{background:var(--c)!important;border-color:var(--c)!important} .present{background:var(--p)!important;border-color:var(--p)!important} .family{background:var(--f)!important;border-color:var(--f)!important} .absent{background:var(--a)!important;border-color:var(--a)!important} #keyboard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;padding-bottom:2px} .kr{display:flex;justify-content:center;gap:2px} .k{height:33px;border-radius:3px;background:#4a4d4e;color:#fff;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-width:18px;line-height:1} .k .main{font-size:12px;font-weight:bold} .k .sub{font-size:7px;color:#bbb;margin-top:1px} .k.act{flex:1.3;font-size:9px} .k.vow{background:#2a4d69;color:#70c1b3} .k.shift-active{background:#ff9800;color:#000} #msg{position:fixed;top:6%;background:#fff;color:#000;padding:5px 10px;border-radius:4px;font-weight:bold;font-size:11px;display:none;z-index:20} </style> </head> <body> <header> <div class="modes"> <button id="btnDaily" class="mbtn active" onclick="setMode('daily')">📅 የቀኑ</button> <button id="btnRandom" class="mbtn" onclick="setMode('random')">🎲 በዘፈቀደ</button> </div> <div class="legend"><span class="dot" style="background:var(--c)"></span>ልክ <span class="dot" style="background:var(--p)"></span>ሌላ <span class="dot" style="background:var(--f)"></span>ዘር</div> </header> <div id="game-area"><div id="board"></div></div> <div id="msg"></div> <div id="keyboard"></div> <script> const H={0x1210:0x1200,0x1280:0x1200,0x1220:0x1230,0x12D0:0x12A0,0x1348:0x1340}; const fam=c=>{const b=c.codePointAt(0)&~7;return H[b]||b}; const norm=c=>{const cp=c.codePointAt(0),b=cp&~7,k=H[b];return k?String.fromCodePoint(k|(cp&7)):c}; const WORDS=["ትምህርት","ሰላማዊ","ብርሃን","ህይወት","መንገድ","መንግሥት","እውነት","ነጻነት","ፍቅርና","ደስታዬ","መጽሐፍ","ሰውነት","ሀገሬን","መልካም","ተስፋዬ","አበባዬ","ዘመናዊ","ወንበር","ቀለበት","ሰንደቅ","ምልክት","ደብዳቤ","ጥበበኛ","ምሽትና","ጦርነት","ሳይንስ","ጥንታዊ","ቦታዎች","አማርኛ","ከተማዋ","ቀዳማዊ","ምዕራብ","ምሥራቅ","ሕክምና","ስፖርት","ሙዚቃዊ","ግብርና","ተፈጥሮ","አየርና","ውሃማው","ምድርና","ፀሐያማ","ተክሎች","እንስሳ","ሕጎችና","ቴክኖሎጂ","ስነጽሑፍ","ታሪካዊ","ባህላዊ","የዓለም"]; const CONSONANTS={h:0x1200,l:0x1208,m:0x1218,r:0x1228,s:0x1230,q:0x1240,b:0x1260,t:0x1270,c:0x1278,n:0x1290,k:0x12a8,w:0x12c8,z:0x12d8,y:0x12e8,d:0x12f0,j:0x12f8,g:0x1300,p:0x1350,f:0x1348,H:0x1210,S:0x1238,T:0x1320,C:0x1328,N:0x1298,K:0x12a8,Z:0x12e0,P:0x1330,Ts:0x1340,Tz:0x1348}; const VOWELS={e:0,u:1,i:2,a:3,o:6,E:0,U:1,I:2,A:3,O:6}; const SHIFT_MAP={t:'ጥ',p:'ጵ',s:'ሽ',h:'ሕ',z:'ዥ',c:'ጭ',n:'ኝ'}; const KB_KEYS=[ 'q:ቅ w:ው e:v r:ር t:ት y:ይ u:v i:v o:v p:ፕ'.split(' '), 'a:v s:ስ d:ድ f:ፍ g:ግ h:ህ j:ጅ k:ክ l:ል'.split(' '), ['SHIFT','z:ዝ','c:ች','b:ብ','n:ን','m:ም','DEL'], ['ENTER'] ].map(r=>r.map(x=>{ if(x==='SHIFT'||x==='DEL'||x==='ENTER')return {k:x,act:true,w:x==='ENTER'?2:1.2}; const [k,s]=x.split(':'); if(s==='v')return {k,v:true}; return {k,C:k.toUpperCase(),s,S:SHIFT_MAP[k]||s}; })); let mode='daily',secret='',dayNum=0,r=0,cur=[],pend=null,over=false,isShift=false; const B=document.getElementById('board'),KB=document.getElementById('keyboard'),M=document.getElementById('msg'); function showM(t){M.textContent=t;M.style.display='block';setTimeout(()=>M.style.display='none',2000);} function initG(){ const now=new Date(),epoch=Date.UTC(2026,0,1); const dayIdx=Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-epoch)/864e5); dayNum=dayIdx+1; if(mode==='daily'){ secret=WORDS[Math.abs(dayIdx)%WORDS.length]; document.getElementById('btnDaily').textContent=`📅 የቀኑ #${dayNum}`; }else{ const pool=WORDS.filter(w=>w!==WORDS[Math.abs(dayIdx)%WORDS.length]); secret=pool[Math.floor(Math.random()*pool.length)]; } r=0;cur=[];pend=null;over=false;isShift=false; B.innerHTML=''; for(let i=0;i<6;i++){ const row=document.createElement('div');row.className='row'; for(let j=0;j<4;j++){const t=document.createElement('div');t.className='tile';t.id=`t${i}${j}`;row.appendChild(t);} B.appendChild(row); } renKb(); } function setMode(newMode){ mode=newMode; document.getElementById('btnDaily').className='mbtn'+(mode==='daily'?' active':''); document.getElementById('btnRandom').className='mbtn'+(mode==='random'?' active':''); initG(); } function renKb(){ KB.innerHTML=''; KB_KEYS.forEach(row=>{ const d=document.createElement('div');d.className='kr'; row.forEach(item=>{ const b=document.createElement('button'); b.className='k'+(item.act?' act':'')+(item.v?' vow':''); if(item.k==='SHIFT'&&isShift)b.classList.add('shift-active'); if(item.w)b.style.flex=item.w; b.id='k_'+item.k; if(item.act){ b.textContent=item.k==='SHIFT'?'⇧ CAPS':item.k; }else if(item.v){ b.innerHTML=`<span class="main">${item.k.toUpperCase()}</span><span class="sub">ድምፅ</span>`; }else{ const sadisChar=isShift?item.S:item.s,latinKey=isShift?item.C:item.k; b.innerHTML=`<span class="main">${sadisChar}</span><span class="sub">${latinKey}</span>`; } b.onclick=()=>onKey(item.act?item.k:(isShift?item.C:item.k)); d.appendChild(b); }); KB.appendChild(d); }); } window.addEventListener('keydown',e=>{ if(over)return; if(e.key==='Enter')onKey('ENTER'); else if(e.key==='Backspace'||e.key==='Delete')onKey('DEL'); else if(/^[a-zA-Z]$/.test(e.key))onKey(e.key); }); function onKey(key){ if(over)return; if(key==='SHIFT'){isShift=!isShift;renKb();return;} if(key==='ENTER'){comP();sub();return;} if(key==='DEL'){ if(pend){pend=null;renRow();return;} if(cur.length>0){cur.pop();renRow();} return; } if(VOWELS[key]!==undefined){ const order=VOWELS[key]; if(pend){ cur.push(String.fromCodePoint(pend.base+order)); pend=null;renRow(); }else if(cur.length<4){ cur.push(String.fromCodePoint(0x12a0+order)); renRow(); } if(isShift){isShift=false;renKb();} return; } if(CONSONANTS[key]!==undefined){ comP(); if(cur.length<4){ pend={base:CONSONANTS[key],char:String.fromCodePoint(CONSONANTS[key]+5)}; renRow(); } if(isShift){isShift=false;renKb();} } } function comP(){ if(pend&&cur.length<4){ cur.push(pend.char); pend=null;renRow(); } } function renRow(){ for(let j=0;j<4;j++){ const t=document.getElementById(`t${r}${j}`); t.classList.remove('pending'); if(j<cur.length)t.textContent=cur[j]; else if(j===cur.length&&pend){t.textContent=pend.char;t.classList.add('pending');} else t.textContent=''; } } function evl(g,ans){ const gn=[...g].map(norm),an=[...ans].map(norm),res=Array(4).fill('absent'),u=Array(4).fill(false); for(let i=0;i<4;i++)if(gn[i]===an[i]){res[i]='correct';u[i]=true;} for(let i=0;i<4;i++){if(res[i]!=='absent')continue;for(let j=0;j<4;j++)if(!u[j]&&gn[i]===an[j]){res[i]='present';u[j]=true;break;}} for(let i=0;i<4;i++){if(res[i]!=='absent')continue;const f=fam(gn[i]);for(let j=0;j<4;j++)if(!u[j]&&fam(an[j])===f){res[i]='family';u[j]=true;break;}} return res; } function sub(){ if(cur.length<4){showM('4 ፊደላት ይሙሉ');return;} const guess=cur.join(''),fb=evl(guess,secret); for(let i=0;i<4;i++){ const t=document.getElementById(`t${r}${i}`); t.classList.remove('pending');t.className='tile '+fb[i]; } if(fb.every(x=>x==='correct')){ showM('አሸንፈዋል! 🎉');over=true; if(window.TelegramWidget?.sendData)TelegramWidget.sendData(JSON.stringify({status:'won',tries:r+1,mode,word:secret})); return; } r++;cur=[];pend=null; if(r===6){ showM(`ተሸንፈዋል! ቃሉ: ${secret}`);over=true; if(window.TelegramWidget?.sendData)TelegramWidget.sendData(JSON.stringify({status:'lost',mode,word:secret})); } } initG(); </script> </body> </html>
